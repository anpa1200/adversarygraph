{{- if not .Values.secrets.existingSecret }}
{{- $dbPass := .Values.secrets.dbPassword | default "" -}}
{{- $redisPass := .Values.secrets.redisPassword | default "" -}}
{{- $rateLimitSecret := .Values.secrets.rateLimitProxySecret | default "" -}}
{{- $bootstrapPassword := .Values.secrets.authBootstrapAdminPassword | default "" -}}
{{- $proxySecret := .Values.secrets.proxySecret | default "" -}}
{{- $existingAdminConfirmed := eq (lower (toString .Values.config.authExistingAdminConfirmed)) "true" -}}
{{- if or (lt (len $dbPass) 24) (regexMatch "(?i)(change[_-]?me|changeme|replace.*password)" $dbPass) -}}
{{- fail "secrets.dbPassword must be a non-placeholder secret of at least 24 characters when secrets.existingSecret is empty" -}}
{{- end -}}
{{- if or (lt (len $redisPass) 24) (regexMatch "(?i)(change[_-]?me|changeme|replace.*password)" $redisPass) (not (regexMatch "^[A-Za-z0-9_-]+$" $redisPass)) -}}
{{- fail "secrets.redisPassword must be a URL-safe, non-placeholder secret of at least 24 letters, digits, underscores, or hyphens when secrets.existingSecret is empty" -}}
{{- end -}}
{{- if or (lt (len $rateLimitSecret) 24) (not (regexMatch "^[A-Za-z0-9_-]+$" $rateLimitSecret)) -}}
{{- fail "secrets.rateLimitProxySecret must be at least 24 characters using only letters, digits, underscore, and hyphen when secrets.existingSecret is empty" -}}
{{- end -}}
{{- if or (eq $dbPass $redisPass) (eq $dbPass $rateLimitSecret) (eq $redisPass $rateLimitSecret) -}}
{{- fail "database, Redis, and rate-limit proxy credentials must be different secrets" -}}
{{- end -}}
{{- if and (not (empty $bootstrapPassword)) (or (lt (len $bootstrapPassword) 24) (regexMatch "(?i)(change[_-]?me|changeme|replace.*password)" $bootstrapPassword)) -}}
{{- fail "secrets.authBootstrapAdminPassword must be empty or a non-placeholder secret of at least 24 characters" -}}
{{- end -}}
{{- if and (not (empty $proxySecret)) (or (lt (len $proxySecret) 24) (regexMatch "(?i)(change[_-]?me|changeme|replace.*password)" $proxySecret)) -}}
{{- fail "secrets.proxySecret must be empty or a non-placeholder secret of at least 24 characters" -}}
{{- end -}}
{{- if and (eq (lower (toString .Values.config.authEnabled)) "true") (empty $bootstrapPassword) (empty $proxySecret) (not $existingAdminConfirmed) -}}
{{- fail "auth-enabled managed-secret installs require secrets.authBootstrapAdminPassword, secrets.proxySecret, or config.authExistingAdminConfirmed=true for a verified upgrade" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adversarygraph.secretName" . }}
  labels:
    {{- include "adversarygraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASS: {{ .Values.secrets.dbPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.authBootstrapAdminPassword | quote }}
  PROXY_SECRET: {{ .Values.secrets.proxySecret | quote }}
  RATE_LIMIT_PROXY_SECRET: {{ .Values.secrets.rateLimitProxySecret | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.minimaxApiKey | quote }}
  LOCAL_LLM_API_KEY: {{ .Values.secrets.localLlmApiKey | quote }}
  NVD_API_KEY: {{ .Values.secrets.nvdApiKey | quote }}
  THREATFOX_AUTH_KEY: {{ .Values.secrets.threatfoxAuthKey | quote }}
  OTX_API_KEY: {{ .Values.secrets.otxApiKey | quote }}
  VIRUSTOTAL_API_KEY: {{ .Values.secrets.virustotalApiKey | quote }}
  URLSCAN_API_KEY: {{ .Values.secrets.urlscanApiKey | quote }}
  SHODAN_API_KEY: {{ .Values.secrets.shodanApiKey | quote }}
  ABUSEIPDB_API_KEY: {{ .Values.secrets.abuseipdbApiKey | quote }}
  CENSYS_API_KEY: {{ .Values.secrets.censysApiKey | quote }}
  CENSYS_ORG_ID: {{ .Values.secrets.censysOrgId | quote }}
  OPENCTI_URL: {{ .Values.secrets.openctiUrl | quote }}
  OPENCTI_TOKEN: {{ .Values.secrets.openctiToken | quote }}
  MALWAREGRAPH_API_KEY: {{ .Values.secrets.malwaregraphApiKey | quote }}
{{- end }}
