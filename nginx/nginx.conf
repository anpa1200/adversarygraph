limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream api {
    server api:8000;
}

upstream frontend {
    server frontend:8080;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'" always;

    client_max_body_size 10m;

    location ^~ /api/malwaregraph/analyses {
        # Allow multipart framing around the application's 256 MiB file cap.
        client_max_body_size 260m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location ^~ /api/analyze {
        client_max_body_size 64m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location = /api/ioc/report {
        client_max_body_size 64m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location ^~ /api/asset-surface/ {
        client_max_body_size 12m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location /api/ {
        try_files __adversarygraph_no_such_file__ @api;
    }

    location @api {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Scope FastAPI's CDN/inline documentation requirements to Swagger and
    # ReDoc rather than weakening the application-wide CSP.
    location ~ ^/(?:docs(?:/oauth2-redirect)?|redoc)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; font-src 'self' data: https://cdn.jsdelivr.net" always;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
