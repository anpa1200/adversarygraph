server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # HSTS belongs at the TLS terminator, not this HTTP-only container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'" always;

    # Keep ordinary JSON/API requests bounded. Only documented upload routes
    # receive larger edge limits; application-level file caps remain authoritative.
    location ^~ /api/malwaregraph/analyses {
        # Allow multipart framing around the application's 256 MiB file cap.
        client_max_body_size 260m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location ^~ /api/analyze {
        client_max_body_size 64m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location = /api/ioc/report {
        client_max_body_size 64m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location ^~ /api/asset-surface/ {
        client_max_body_size 12m;
        try_files __adversarygraph_no_such_file__ @api;
    }

    location /api/ {
        try_files __adversarygraph_no_such_file__ @api;
    }

    # Shared API proxy target used by all bounded locations above.
    location @api {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This container is the trust boundary: do not preserve a client-supplied
        # X-Forwarded-For value that could bypass backend IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite any client value. The API accepts forwarded client IPs only
        # when this internal frontend-to-API secret matches its configuration.
        proxy_set_header X-RateLimit-Proxy-Secret "${RATE_LIMIT_PROXY_SECRET}";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI's generated Swagger/ReDoc pages load versioned assets from
    # cdn.jsdelivr.net and use a small inline bootstrap script. Keep that
    # exception scoped to the documentation endpoints; the SPA retains the
    # stricter server-level policy above.
    location ~ ^/(?:docs(?:/oauth2-redirect)?|redoc)$ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; font-src 'self' data: https://cdn.jsdelivr.net" always;
    }

    location = /openapi.json {
        try_files __adversarygraph_no_such_file__ @api;
    }

    # SPA fallback: serve index.html for all non-file routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
